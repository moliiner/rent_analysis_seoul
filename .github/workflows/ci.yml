name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install requirements (pinned by constraints.txt)
        run: pip install -r requirements.txt -c constraints.txt
      - name: Lint (unused imports and names)
        run: python -m pyflakes src tests app
      - name: Run the test suite (notebooks are not executed in CI)
        run: pytest -q
